server:
  port: 8080

spring:
  application:
    name: courseapp-backend

  # ---------------------------------------------------------------
  # H2 in-memory, chạy theo chuẩn PostgreSQL (MODE=PostgreSQL)
  #   DATABASE_TO_LOWER=TRUE     -> tên bảng/cột viết thường như Postgres
  #   DEFAULT_NULL_ORDERING=HIGH -> NULL sắp xếp giống Postgres
  #   DB_CLOSE_DELAY=-1          -> giữ DB khi còn chạy ứng dụng
  # ---------------------------------------------------------------
  datasource:
    url: jdbc:h2:mem:course_app;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # Trang quản trị H2: http://localhost:8080/h2-console
  #   JDBC URL: jdbc:h2:mem:course_app  | User: sa | Password: (trống)
  h2:
    console:
      enabled: true
      path: /h2-console

  # Tự chạy file init database mỗi lần khởi động
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      encoding: UTF-8

  jpa:
    hibernate:
      ddl-auto: none          # bảng được tạo bởi db/schema.sql, Hibernate không tự tạo
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Chưa có đăng nhập: request không gửi header X-User-Id sẽ dùng user demo này
app:
  demo-user-id: 2
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173

logging:
  level:
    org.hibernate.SQL: warn
